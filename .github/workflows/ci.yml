name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Test & Lint Rust Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> server/target"

      - name: Rust Code Format Check
        run: cargo fmt --check
        working-directory: server

      - name: Rust Clippy Lints
        run: cargo clippy -- -D warnings
        working-directory: server

      - name: Run Server Unit & Integration Tests
        run: cargo test --verbose
        working-directory: server

      - name: Build Release Binary
        run: cargo build --release
        working-directory: server

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build Debian Package (.deb)
        run: cargo deb --no-build
        working-directory: server

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidvault-server-deb
          path: server/target/debian/*.deb
          retention-days: 7
