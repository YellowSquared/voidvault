name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Lint & Package WebExtension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint Extension (Mozilla AMO standard)
        run: npx web-ext lint --source-dir extension

      - name: Build Extension Package
        run: |
          mkdir -p dist
          npx web-ext build --source-dir extension --overwrite-dest --artifacts-dir dist

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voidvault-webextension
          path: dist/*
          retention-days: 7

  server:
    name: Test & Lint Rust Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "server -> server/target"

      - name: Rust Code Format Check
        run: cargo fmt --check
        working-directory: server

      - name: Rust Clippy Lints
        run: cargo clippy -- -D warnings
        working-directory: server

      - name: Run Server Unit & Integration Tests
        run: cargo test --verbose
        working-directory: server

      - name: Build Release Binary
        run: cargo build --release
        working-directory: server
