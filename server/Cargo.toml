[package]
name = "voidvault-server"
version = "0.2.0"
edition = "2021"
description = "Zero-knowledge FIDO2 hardware attestation password vault server"
repository = "https://github.com/YellowSquared/voidvault"
license = "MIT"
readme = "../README.md"

[dependencies]
axum = "0.8"
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package.metadata.deb]
maintainer = "YellowSquared <voidvault@yellowsquared.io>"
copyright = "2026 YellowSquared"
license-file = ["../LICENSE", "4"]
extended-description = """\
VoidVault server daemon: stores encrypted ciphertext blobs indexed by \
credential attestation locators. Server has zero knowledge of master \
passwords, salts, or keys."""
section = "net"
priority = "optional"
maintainer-scripts = "debian/scripts"
assets = [
    ["target/release/voidvault-server", "usr/bin/", "755"],
    ["debian/default.conf", "etc/voidvault/voidvault.conf", "644"],
]
conf-files = [
    "/etc/voidvault/voidvault.conf"
]

[package.metadata.deb.systemd-units]
unit-scripts = "debian/systemd"
enable = true
start = true
