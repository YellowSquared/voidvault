services:
  voidvault-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: voidvault-server:latest
    container_name: voidvault-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BIND_ADDR=0.0.0.0:8080
      - DATABASE_PATH=/data/voidvault.db
      - VOIDVAULT_MAX_NEW_VAULTS_PER_HOUR=3
      - VOIDVAULT_WINDOW_SECS=3600
    volumes:
      - voidvault-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  voidvault-data:
    name: voidvault-data
